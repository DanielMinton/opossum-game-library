<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- "Add to Home Screen" on a phone opens the game full screen, without the browser's bars. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sammy">
  <meta name="theme-color" content="#000000">

  <!-- Icons and the picture that shows when the link is shared (files in game/share/, copied into dist/ by the build). -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

  <meta property="og:image:height" content="630">

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    /* main.js sets the canvas size and position (src/layout.js does the maths) so its pixels line up with the screen's. */
    #screen { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; }
    /* On-screen touch buttons (src/touch.js places them; src/layout.js does the maths). Hidden unless on a touch screen. */
    #touch-controls { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 2; }
    #touch-controls.on { display: block; }
    .tbtn { position: absolute; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    .tbtn canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
    .tbtn.hide { display: none; }
    /* "Turn your phone sideways" message (src/phone.js), over everything while the phone is upright. */
    #sideways { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: #000; display: none; z-index: 4; touch-action: none; }
    #sideways.on { display: block; }
    #sideways canvas { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #sideways button { position: absolute; margin: 0; padding: 0; border: 0; background: transparent; color: transparent; font-size: 1px;
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #sideways button:focus-visible { outline: 2px solid #fcd824; }
    #test-result { z-index: 5; position: absolute; left: 0; top: 0; margin: 0; color: #0f0; font: 10px monospace; white-space: pre-wrap; max-width: 100%; }
  </style>
</head>
<body>
  <canvas id="screen" width="320" height="224" aria-label="Sammy game screen"></canvas>

  <script>
globalThis.SAMMY_ASSET_BASE = 'assets/';

// ---- src/config.js ----
// Tuning values for the placeholder prototype.
// Every number comes from the example docs in templates/examples/ (all PROPOSED, not approved).
// Change values here, not inside the game code.
(function (S) {
  S.CONFIG = {
    screenW: 320,              // Genesis H40 mode width
    screenH: 224,
    step: 1 / 60,              // fixed simulation step (seconds)
    groundY: 192,              // top of the grass in level 1

    sound: {                   // volume of real sound files, 0 to 1 (placeholder beeps are unchanged)
      musicVolume: 0.6,        // AUDIO.md: music sits under the sound effects
      sfxVolume: 0.8,
    },

    gravity: 900,              // px/s^2
    maxFall: 320,

    sammy: {
      maxHp: 3,
      runSpeed: 110,           // faster than a chasing jogger (60)
      accel: 900,
      decel: 1400,
      jumpSpeed: 330,          // ~60 px jump height
      jumpCutSpeed: 120,       // releasing jump early cuts the jump
      coyoteTime: 0.08,
      jumpBuffer: 0.1,
      bodyW: 20, bodyH: 30,    // character-sammy ASSET.md
      deadW: 28, deadH: 14,    // body box while playing dead
      invulnTime: 1.0,
      hurtTime: 0.2,           // hurt strip: 2 frames @ 10 fps
      hurtKnockX: 120, hurtKnockY: 150,
      attackTime: 4 / 15,      // tail-whip: 4 frames @ 15 fps
      attackHitStart: 2 / 15,  // hit frame = 2
      attackHitEnd: 3 / 15,
      whipW: 20, whipH: 12,
      landTime: 2 / 15,
      koTime: 0.6,             // ko strip: 6 frames @ 10 fps
      koWait: 1.0,             // pause before checkpoint restart
    },

    possum: {                  // ability-play-possum ABILITY.md
      radius: 96,
      maxTime: 3.0,
      minTime: 0.5,
      dropTime: 0.5,           // play-dead strip: 4 frames @ 8 fps
      getUpTime: 0.25,
      cooldown: 6.0,
      // ignoreAfter (how long a zombie ignores Sammy after he gets up) moved to each enemy type's `possumIgnore` (2026-10-20).
      readyFlash: 1.0,         // prototype addition: HUD icon flashes this long when the cooldown ends
    },

    // ---------- enemy types ----------
    // Every block with a `brain` is an enemy type; sim.js registers it in S.ENEMY_TYPES at load (and throws if a field is missing).
    // brain: 'walker' (patrol, chase, lunge, as the jogger) or 'turret' (stands and throws, as the vendor).
    // art: the manifest prefix (`<art>:walk` …). start / startAnim: the state and animation it is made in.
    // flinch: false = a hit flashes it white and changes nothing else. knockback / sawKnockback: px/s pushed by a whip / a saw cut.
    // cartKnock: px/s pushed by the cart tipping over (0 = none). shieldPush: px it is pushed back when the lid blocks its hit.
    // hitY: its attack box starts this many px above its feet. possum: 'confused' | 'shrug' | 'ignore' (how Play Possum fools it; 'ignore' = it doesn't).
    // Optional: leap (the cheerleader's jump instead of a lunge), attackSfx / defeatSfx (a sound of its own), litterGap (level entries with `litter`).
    // possumIgnore: seconds it ignores Sammy after he gets up. defeatStyle / sawStyle: how it goes down from a whip / the saw.
    jogger: {                  // enemy-zombie-jogger ASSET.md
      brain: 'walker', art: 'jogger', start: 'patrol', startAnim: 'walk',
      hp: 2,
      patrolSpeed: 30,
      chaseSpeed: 60,
      patrolRange: 64,
      notice: 96,
      giveUpDist: 160,
      giveUpTime: 2.0,
      attackRange: 26,
      attackTime: 0.4,         // 4 frames @ 10 fps
      attackHitStart: 0.2,     // hit frame = 2
      attackHitEnd: 0.3,
      attackCooldown: 1.2,
      hitW: 16, hitH: 20,
      bodyW: 18, bodyH: 38,
      hitReactTime: 2 / 12,
      defeatTime: 8 / 12,
      flinch: true, knockback: 120, sawKnockback: 40, cartKnock: 160, shieldPush: 16, hitY: 26,
      possum: 'confused', possumIgnore: 1.5,
      defeatStyle: 'pop', sawStyle: 'sliced',
    },

    vendor: {                  // enemy-zombie-hot-dog-vendor ASSET.md
      brain: 'turret', art: 'vendor', start: 'idle', startAnim: 'idle',
      hp: 2,
      notice: 160,
      throwEvery: 2.0,
      throwTime: 0.4,
      releaseAt: 0.2,          // release frame = 2
      bodyW: 20, bodyH: 36,
      hitReactTime: 2 / 12,
      defeatTime: 6 / 12,
      projW: 10, projH: 6,
      projFlight: 0.9,
      projGravity: 500,
      projLife: 3.0,
      flinch: true, knockback: 0, sawKnockback: 0, cartKnock: 0, shieldPush: 0, hitY: 0,
      possum: 'shrug', possumIgnore: 1.5,
      defeatStyle: 'deflate', sawStyle: 'sliced',
    },
    // New enemy types go here (hippie, sweater, cheerleader, baby, brute): one block each, same fields, a `brain`.
    // Optional hooks a block may add (read by the walker brain and the damage code only when present):
    //   pool: seconds the goo pool it melts into stays on the ground after a whip kill (an effect, drawing only; no slow).
    //   shoveKnockX / shoveKnockY: how far its ATTACK throws Sammy (a plain bump still uses sammy.hurtKnockX/Y).
    //   stripsLid: true = its attack takes every charge of the trash lid in one go (Sammy is still thrown, loses no heart).
    //   sniffStop: with possum 'sniff', how close (px) it walks to a playing-dead Sammy before it stops to sniff.
    hippie: {                  // enemy-zombie-hippie (design 2.3): stoned, rotting, the "slow wall": 3 whips, half knockback. Brain: walker
      brain: 'walker', art: 'hippie', start: 'patrol', startAnim: 'walk',
      hp: 3,
      patrolSpeed: 18, chaseSpeed: 36, patrolRange: 48,
      notice: 80, giveUpDist: 128, giveUpTime: 2.0,
      attackRange: 26,
      attackTime: 0.4,         // claw lunge: 4 frames @ 10 fps
      attackHitStart: 0.2,     // hit frame = 2
      attackHitEnd: 0.3,
      attackCooldown: 1.6,
      hitW: 18, hitH: 20,
      bodyW: 20, bodyH: 40,
      hitReactTime: 2 / 12,
      defeatTime: 8 / 12,      // the melt
      flinch: true, knockback: 60, sawKnockback: 20, cartKnock: 80, shieldPush: 16, hitY: 26,
      possum: 'confused', possumIgnore: 3.0, // too stoned to notice Sammy for twice a jogger's grace
      defeatStyle: 'melt', sawStyle: 'sliced',
      pool: 1.6,               // the goo pool under him: grows while he melts (0.67 s), lingers about a second, then gone
    },

    sweater: {                 // enemy-zombie-sweater (design 2.4): loud zigzag sweater, bunny slippers, rubber duck. The brawler. Brain: walker, no flinch
      brain: 'walker', art: 'sweater', start: 'patrol', startAnim: 'walk',
      hp: 3,
      patrolSpeed: 22, chaseSpeed: 50, patrolRange: 48,
      notice: 100, giveUpDist: 144, giveUpTime: 2.5,
      attackRange: 32,
      attackTime: 4 / 8,       // two-handed shove: 4 frames @ 8 fps (both arms up on frames 0-1 = the tell)
      attackHitStart: 2 / 8,   // hit frame = 2
      attackHitEnd: 3 / 8,
      attackCooldown: 1.5,
      hitW: 24, hitH: 26,
      bodyW: 24, bodyH: 48,
      hitReactTime: 2 / 12,    // how long the white flash lasts (he never reels)
      defeatTime: 8 / 10,      // the flop
      flinch: false, knockback: 0, sawKnockback: 0, cartKnock: 0, shieldPush: 0, hitY: 36, // a hit flashes him white and changes nothing else
      shoveKnockX: 240, shoveKnockY: 150, stripsLid: true, // twice a jogger's bump (sammy.hurtKnockX 120); the lid comes off whole
      possum: 'sniff', sniffStop: 32, possumIgnore: 1.5,   // fooled, but walks up and stands over Sammy (32 px: his body never touches the lying one)
      defeatStyle: 'flop', sawStyle: 'sliced',
    },

    cheerleader: {             // enemy-zombie-cheerleader: pom-poms, leaping lunge. Walker brain + leap (2026-10-20, Proposed)
      brain: 'walker', art: 'cheerleader', start: 'patrol', startAnim: 'walk',
      leap: true,              // instead of the lunge: stops and cheers (the tell, idle strip), then jumps at Sammy; hurts while airborne
      hp: 2,
      patrolSpeed: 36, chaseSpeed: 70, patrolRange: 64,
      notice: 112, giveUpDist: 160, giveUpTime: 2.0,
      leapRange: 72,           // starts the leap from this far
      leapWindup: 0.45,        // the cheer: her only tell. Harmless
      leapVx: 170, leapVy: 190, // about 0.42 s in the air, 20 px high, 72 px long
      leapMaxAir: 0.6,         // safety: lands by then whatever happens
      leapLand: 0.2,           // stuck on landing: harmless, whip her now
      leapCooldown: 2.0,
      attackRange: 72,         // = leapRange (the walker's chase stops this close; the leap replaces the lunge)
      hitW: 18, hitH: 24,      // (the leap hurts with her body box; no separate attack box)
      bodyW: 16, bodyH: 40,
      hitReactTime: 2 / 12,
      defeatTime: 8 / 12,
      flinch: true, knockback: 120, sawKnockback: 40, cartKnock: 160, shieldPush: 16, hitY: 0,
      possum: 'confused', possumIgnore: 0.75, // forgets fast: half a jogger's grace
      defeatStyle: 'burst', sawStyle: 'sliced',
    },

    baby: {                    // enemy-zombie-baby: exposed brain, eyeball on a stalk, rattle. Comes in threes. Walker brain (2026-10-20, Proposed)
      brain: 'walker', art: 'baby', start: 'patrol', startAnim: 'walk',
      hp: 1,
      patrolSpeed: 30, chaseSpeed: 90, patrolRange: 40, // faster than a jogger (60), slower than Sammy (110)
      notice: 128, giveUpDist: 200, giveUpTime: 3.0,    // tenacious
      attackRange: 18,
      attackTime: 4 / 12,      // rattle smack: 4 frames @ 12 fps
      attackHitStart: 2 / 12,  // hit frame = 2
      attackHitEnd: 3 / 12,
      attackCooldown: 0.8,
      attackSfx: 'sfx-baby-rattle',
      hitW: 12, hitH: 14,
      bodyW: 12, bodyH: 20,    // 30 px sprite, 20 px body: the whip (10..22 px up) still overlaps the top 10 px
      hitReactTime: 2 / 12,    // never seen in play (1 hp); kept for the art check
      defeatTime: 8 / 12,
      defeatSfx: 'sfx-baby-cry',
      flinch: true, knockback: 0, sawKnockback: 0, cartKnock: 160, shieldPush: 8, hitY: 16, // the rattle box starts 16 px up (a jogger's is 26: too high for a toddler)
      possum: 'ignore', possumIgnore: 0, // never fooled: toddlers don't know what dead is
      defeatStyle: 'pop', sawStyle: 'sliced', // owner answer 8: red gore, sliced like anyone
      litterGap: 32,           // a level entry { type: 'baby', litter: 3 } stands three of them this far apart
    },

    // ---------- THE BRUTE (level 1 boss, 2026-10-20, all Proposed except where DECISIONS.md says Confirmed) ----------
    // brain 'boss': walks at Sammy, picks an attack by distance and a fixed count (no luck), each attack = tell, hit, opening.
    // Spawned by the arena after the last gauntlet wave (gauntlet.boss); the exit opens when he is dead. Never flinches.
    // Times are seconds; boxes are px from his feet point (x ahead of him, y up from the ground). The chainsaw cuts him ANY time
    // (owner answer 7): balanced with hit points and the two free openings (stagger, enrage), with the most gore on saw hits.
    brute: {
      brain: 'boss', art: 'brute', name: 'THE BRUTE', start: 'enter', startAnim: 'walk',
      hp: 24, staggerAt: 12, enrageAt: 9,      // full design: 30 / 15 / 9. 24 = three good saw openings, or ~90 s of careful whipping
      walkSpeed: 32, bodyW: 44, bodyH: 80,     // can't be jumped (80 tall, the jump is 60): get past him in an opening or with Play Possum
      decideEvery: 1.0,                        // while walking, picks an attack this often
      walkMax: 3.0,                            // never walks longer than this without a slam (cooldown or not)
      enterWalk: 0.6, enterRoar: 0.8,          // walks out of the fourth arch, then roars with his arms wide
      swipe: { range: 64, tell: 0.45, step: 24, stepTime: 0.1, hits: 3 / 10, box: { x0: 8, x1: 64, y0: 0, y1: 64 }, opening: 0.9, knockX: 240, knockY: 150 }, // low: lying flat does not work; knocks twice as far as a jogger
      slam: { range: 160, tell: 0.5, hit: 0.15, box: { x0: 8, x1: 56, y0: 0, y1: 40 }, wave: { speed: 160, w: 16, h: 10, life: 1.7 }, stuck: 1.0, cooldown: 4.0 }, // two floor shockwaves: jump them
      spin: { range: 56, tell: 0.6, hits: 2 / 10, box: { x0: 0, x1: 56, y0: 20, y1: 72 }, dizzy: 1.2 }, // when Sammy is behind him; high: lie flat
      // high: lie flat under the stream. The puddles land where the acid fell when the stream ends and burn anyone (standing or lying)
      // once they have spread (puddleLand): get up and step out of them in time.
      vomit: { every: 4, tell: 0.6, time: 1.0, box: { x0: 24, x1: 144, y0: 24, y1: 44 }, puddles: [48, 88, 128], puddleW: 28, puddleLand: 0.6, puddleLife: 5.0, opening: 0.5 },
      enraged: { tellScale: 0.7, openScale: 2 / 3, walkSpeed: 48, swipeStep: 16, slamCooldown: 2.5, waveGap: 0.35, vomitEvery: 3, vomitTime: 1.3, puddleLife: 7.0 }, // at enrageAt hp
      staggerTime: 0.8, enrageTime: 1.0,       // the two free openings (safe to touch)
      confusedTime: 1.2,                       // (drawing note only: he stays confused until Sammy gets up, like a jogger)
      hitReactTime: 0.1,                       // white flash per hit (flinch: false)
      defeatTime: 10 / 6, deathHold: 1.5,      // death crawl strip (10 frames @ 6 fps), then held flat; hot dogs drop during the hold
      deathCrawlSpeed: 24, deathCrawlHurts: false, // the crawl toward Sammy is harmless (Proposed; the full design's "last scare" is one flag away)
      hotdogs: 3,                              // "HE HAD HOT DOGS IN HIM."
      sawHitstop: 4 / 60, sawChunks: 2,        // gore overload: every saw cut freezes 4 frames, shakes, and throws chunks (not only the kill)
      flinch: false, knockback: 0, sawKnockback: 0, cartKnock: 0, shieldPush: 0, hitY: 0,
      possum: 'confused', possumIgnore: 1.5,
      defeatStyle: 'crawl', sawStyle: 'crawl', // no sliced death: he crawls, then goes flat
      // His lines (deadpan and profane on purpose, owner rule; 3x5 font letters only; the floating ones 16 characters or fewer).
      // The "down" line is in render.js (GAGS_BY_TYPE.brute.crawl), shown when he goes flat.
      lines: {
        enter: 'THE BRUTE. HE ATE THE OTHER ZOMBIES.',  // banner when he walks in
        supplies: 'SUPPLIES. DON\'T ASK.',             // over the lid and the chainsaw dropping in
        taunts: ['MEAT.', 'SMALL MEAT.', 'NEED. MEAT.'], // over him at the start of every third tell, in turn
        enrage: 'HE\'S PISSED NOW.',                    // at the enrage roar
        hotdogs: 'HE HAD HOT DOGS IN HIM.',             // when the three hot dogs bounce out of him
      },
    },

    cart: {                    // prop-hot-dog-cart INTERACTION.md
      w: 64, h: 48,
      rockWindow: 1.5,
      tipTime: 0.25,           // 3 frames @ 12 fps
      spillCount: 3,
      knockRadius: 48,
      hotDogLife: 10.0,
    },

    lid: { hits: 3 },          // item-powerup-trash-lid-shield ABILITY.md

    chainsaw: {                // Stage B (Proposed): pickup on screen 11; WHIP button (held) revs it instead of whipping
      fuel: 20,                // seconds of revving in a full tank
      carryDrain: 0.25,        // fuel per second used just carrying it (not revving); revving uses 1 per second
      reach: 28,               // cutting box in front of Sammy's feet point, px
      tick: 0.12,              // one cut every this many seconds while revving
      damage: 1,               // per cut (joggers and vendors have 2 hp: two cuts)
      slow: 0.6,               // run speed while revving
      slashTime: 0.2,          // a quick tap still revs (and cuts) this long
    },

    gauntlet: {
      // Typed waves (2026-10-20, owner answer 2: every type in level 1; Proposed lists): each wave is a list of entries, one body
      // each, dropping in from alternating sides (first entry from the left). An entry is a type name, or { type, litter } to drop
      // a litter of that type from one side, litterGap px apart (the baby). The HUD counter reads waves.length.
      waves: [
        ['jogger', 'jogger', 'cheerleader'],                     // 1: warm-up with a leaper. 3 bodies, 6 hp
        [{ type: 'baby', litter: 3 }, 'hippie', 'jogger'],       // 2: the litter from the left, the slow wall and a jogger. 5 bodies, 7 hp
      ],
      waveDelay: 1.0,
      // The boss (2026-10-20, owner answer 4): after the last wave, `boss` walks in from the arch `bossArch` px before the gate,
      // `bossDelay` s after the wave dies. The supplies drop in at the same moment (Proposed: a trash lid and a chainsaw, so Sammy
      // always has a saw and a lid for the fight; the chainsaw pickup refuels a saw he already carries), `supplyX` px from the arena's left wall.
      boss: 'brute', bossDelay: 1.0, bossArch: 56, supplies: [{ type: 'lid', dx: 72 }, { type: 'chainsaw', dx: 104 }],
    },
  };

  // 9-bit colour: each channel snapped to 0,36,72,...,252 (templates/STYLE_GUIDE.md)
  // Night palette (Zombie Hunter look, design/STYLE_GUIDE.md "Night mood"). Proposed.
  S.PAL = {
    black: '#000000', white: '#fcfcfc', grey: '#909090', dark: '#242424',
    sky0: '#000024', sky1: '#000048', sky2: '#24246c', sky3: '#482448', sky4: '#48246c', // night sky; sky3/sky4 = thin horizon haze above the skyline
    skyline: '#242448', trees: '#002424', bushes: '#244824',
    grass: '#246c48', dirt: '#48486c', dirtDark: '#242448',                          // night grass; wet blue-grey earth
    water: '#00246c', waterHi: '#6c90d8',
    sammy: '#d8d8d8', sammyDark: '#909090', nose: '#fc90b4',
    jogger: '#6cb46c', joggerDark: '#246c24', band: '#fc24fc',
    vendor: '#b4b46c', vendorDark: '#6c6c24', hat: '#fcfcfc',
    cart: '#d82424', cartDark: '#902424', umbrella: '#fcd824',
    hotdog: '#fcb424', mustard: '#fcfc24',
    lid: '#909090', lidHi: '#d8d8d8',
    bench: '#906c24', rock: '#6c6c90', fence: '#6c4824', pole: '#242424', lamp: '#fcd86c', lampOff: '#6c6c48',
    heart: '#fc2424', gate: '#484848', hud: '#242448', hudHi: '#48486c',
    // Night extras
    moon: '#fcfcd8', moonMid: '#d8d8b4', moonCrater: '#b4b490', star: '#d8d8fc', window: '#fcd86c',
    lampGlow: '#fcb424', lampHalo: '#d89000', lampDeep: '#904800',
    stone: '#242448', stoneMid: '#48486c', stoneLight: '#6c6c90', arch: '#000024',
    leaf0: '#fcb400', leaf1: '#d86c00', leaf2: '#b44800',
    // Scenery extras (2026-10-19, Proposed): foliage ramp, earth, lit stone, water foam, wood, bins. None of these are gore colours.
    grassHi: '#48906c', grassLo: '#004824', soilWarm: '#6c4848', soilWarmDk: '#482424', slateHi: '#9090b4', stoneMoon: '#b4b4d8',
    leaf3: '#6c2400', woodDk: '#482400', waterMid: '#2448b4', foam: '#b4d8fc', canMid: '#486c48',
    // Zombie roster placeholders (2026-10-20, Proposed): each type in its own contrasting scheme, from the importer palettes.
    // Hippie = purple vest and goo over olive skin; sweater = gold knit with purple and teal zigzags over dark brown skin.
    hippie: '#904890', hippieDark: '#6c2448', hippieSkin: '#90b490', hippieGoo: '#9048d8', hippieJeans: '#48486c',
    sweaterGold: '#fcb448', sweaterPurple: '#900048', sweaterTeal: '#24d8d8', sweaterTealDk: '#489090', sweaterSkin: '#904824',

// One call to SAMMY.update(state, input) advances the game by one fixed 1/60 s step.
// Sounds and music are requested by pushing { type, id } objects onto state.events.
(function (S) {
  const C = S.CONFIG;
  const P = C.sammy;
  const DT = C.step;
  const G = C.groundY;

  // ---------- small helpers ----------
  const sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function footBox(e, w, h) { return { x: e.x - w / 2, y: e.y - h, w, h }; }
  function playerBox(p) {
    const dead = p.state === 'playdead' || p.state === 'getup' || p.state === 'ko';
    return dead ? footBox(p, P.deadW, P.deadH) : footBox(p, P.bodyW, P.bodyH);
  }
  function setAnim(e, name) { if (e.anim !== name) { e.anim = name; e.animT = 0; } }
  function sfx(s, id) { s.events.push({ type: 'sfx', id }); }
  function music(s, id) { s.events.push({ type: 'music', id }); }
  function effect(s, kind, x, y, life, extra) {
    s.effects.push(Object.assign({ kind, x, y, t: 0, life }, extra || {}));
  }
  // Looping sound (the chainsaw's rev): one event when it starts, one when it stops, never every frame.
  function sawLoop(s, on) {
    if (!!s.sawLoop === on) return;
    s.sawLoop = on;
    s.events.push({ type: 'sfx-loop', id: 'sfx-chainsaw-rev', on });
  }

  S.makeInput = function () {
    return {
      held: { left: false, right: false, up: false, down: false, jump: false, attack: false, possum: false },
      pressed: { left: false, right: false, jump: false, attack: false, possum: false, start: false, restart: false },
    };
  };

  // ---------- creating things ----------
  function makePlayer(x, y) {
    return {
      x, y, vx: 0, vy: 0, face: 1, grounded: true, groundKind: 'ground',
      hp: P.maxHp, shield: 0, state: 'normal', t: 0, invuln: 0,
      coyote: 0, buffer: 0, landT: 0, possumCd: 0, possumFlash: 0, hitSet: null,
      saw: null, // chainsaw while carried: { fuel (seconds), revving, tick (s to next cut), slash (s of tap-rev left) }
      anim: 'idle', animT: 0,
    };
  }
  // ---------- enemy types ----------
  // S.ENEMY_TYPES: type name -> { name, cfg, brain, update, states, anims }. One row per type, built from every config.js block
  // that has a `brain`. Nothing else in this file asks "is it a jogger?": every difference between types is a field of its
  // config block (see config.js, "enemy types") read through typeOf(e). An enemy whose type has no row is an error, never a jogger.
  const BRAINS = {
    // brain: { update(s, e), states: every state the brain can put an enemy in (the render sweep draws each), anims: state -> animation,
    //   resume: the state it goes back to when Sammy gets up after Play Possum,
    //   confusable (optional): the only states Play Possum can interrupt (default: anything but attack, hitreact, leap and land) }
    // sniff (possum 'sniff', the sweater): fooled by Play Possum, but walks over to Sammy first; once close it stands in 'confused'.
    // windup / leap / land: the leaping kinds (`leap: true`, the cheerleader) use them instead of attack.
    walker: { update: (s, e) => updateWalker(s, e), states: ['spawn', 'patrol', 'chase', 'attack', 'windup', 'leap', 'land', 'hitreact', 'confused', 'sniff', 'defeat', 'dead'], resume: 'patrol',
      anims: { spawn: 'idle', patrol: 'walk', chase: 'walk', attack: 'attack', windup: 'idle', leap: 'attack', land: 'attack', hitreact: 'hit', confused: 'idle', sniff: 'walk', defeat: 'defeat', dead: 'defeat' } },
    turret: { update: (s, e) => updateTurret(s, e), states: ['idle', 'throw', 'hitreact', 'shrug', 'defeat', 'dead'], resume: 'idle',
      anims: { idle: 'idle', shrug: 'idle', throw: 'throw', hitreact: 'hit', defeat: 'defeat', dead: 'defeat' } },
    // The boss (the Brute): one state per pose, so each attack is tell -> hit -> opening with its own picture. The animation names are
    // the combined strips the art comes in (swipe = tell, step, 3 hits, opening in one strip); the drawer picks the frame from the state.
    boss: { update: (s, e) => updateBoss(s, e), resume: 'walk', confusable: ['walk', 'enter'],
      states: ['enter', 'walk', 'swipe-tell', 'swipe-step', 'swipe-hit', 'swipe-open', 'slam-tell', 'slam-hit', 'slam-stuck',
        'spin-tell', 'spin-hit', 'spin-dizzy', 'vomit-tell', 'vomit-stream', 'vomit-open', 'stagger', 'enrage', 'confused', 'hitreact', 'defeat', 'dead'],
      anims: { enter: 'walk', walk: 'walk', 'swipe-tell': 'swipe', 'swipe-step': 'swipe', 'swipe-hit': 'swipe', 'swipe-open': 'swipe',
        'slam-tell': 'slam', 'slam-hit': 'slam', 'slam-stuck': 'slam', 'spin-tell': 'spin', 'spin-hit': 'spin', 'spin-dizzy': 'spin',
        'vomit-tell': 'spin', 'vomit-stream': 'vomit', 'vomit-open': 'vomit', stagger: 'stagger', enrage: 'stagger', confused: 'walk',
        hitreact: 'walk', defeat: 'death', dead: 'death' } },
  };
  // Boss states in which touching him hurts (walking, winding up, swinging). Openings, stuck, dizzy, confused, staggering: safe.
  const BOSS_TOUCH_HURTS = new Set(['enter', 'walk', 'swipe-tell', 'swipe-step', 'swipe-hit', 'slam-tell', 'slam-hit', 'spin-tell', 'spin-hit', 'vomit-tell', 'vomit-stream']);
  S.BOSS_TOUCH_HURTS = BOSS_TOUCH_HURTS;
  const TYPE_FIELDS = ['brain', 'art', 'start', 'startAnim', 'hp', 'bodyW', 'bodyH', 'hitReactTime', 'defeatTime', 'flinch', 'knockback',
    'sawKnockback', 'cartKnock', 'shieldPush', 'hitY', 'possum', 'possumIgnore', 'defeatStyle', 'sawStyle'];
  const POSSUM_KINDS = ['confused', 'shrug', 'sniff', 'ignore']; // 'sniff' = walks up and stands over Sammy (the sweater); 'ignore' = Play Possum does nothing to it (the baby)
  S.ENEMY_TYPES = {};
  S.ENEMY_TYPE_FIELDS = TYPE_FIELDS;
  // Registers (or replaces) an enemy type from a config block. Throws on a missing field or an unknown brain, so a half-written
  // type fails at load, not in the middle of a level. Tests use it for stub types.
  S.defineEnemyType = function (name, cfg) {
    for (const f of TYPE_FIELDS) if (cfg[f] === undefined) throw new Error('enemy type "' + name + '" is missing "' + f + '" in config.js');
    const brain = BRAINS[cfg.brain];
    if (!brain) throw new Error('enemy type "' + name + '" has unknown brain "' + cfg.brain + '" (known: ' + Object.keys(BRAINS).join(', ') + ')');
    if (!brain.states.includes(cfg.start)) throw new Error('enemy type "' + name + '" starts in "' + cfg.start + '", which its brain has no state for');
    if (!POSSUM_KINDS.includes(cfg.possum)) throw new Error('enemy type "' + name + '" has unknown possum reaction "' + cfg.possum + '"');
    if (cfg.possum !== 'ignore' && !brain.states.includes(cfg.possum)) throw new Error('enemy type "' + name + '" reacts to Play Possum with "' + cfg.possum + '", which its brain has no state for');
    const T = { name, cfg, brain: cfg.brain, update: brain.update, states: brain.states, anims: brain.anims, resume: brain.resume, confusable: brain.confusable || null };
    S.ENEMY_TYPES[name] = T;
    return T;
  };
  S.enemyType = function (name) {
    const T = S.ENEMY_TYPES[name];
    if (!T) throw new Error('unknown enemy type "' + name + '" (known: ' + Object.keys(S.ENEMY_TYPES).join(', ') + ')');
    return T;
  };
  const typeOf = (e) => S.enemyType(e.type);
  for (const name of Object.keys(C)) if (C[name] && typeof C[name] === 'object' && C[name].brain) S.defineEnemyType(name, C[name]);

  function makeEnemy(def, idx, extra) {
    const T = typeOf(def), k = T.cfg;
    return Object.assign({
      id: (extra && extra.id) || ('e' + idx), type: def.type, def,
      x: def.x, y: def.y != null ? def.y : G, vx: 0, vy: 0, face: -1, dir: -1,
      grounded: true, hp: k.hp, state: k.start, t: 0,
      home: def.x, cd: 0, lostT: 0, throwT: 0.5, released: false, attackHit: false,
      confused: false, arena: false, anim: k.startAnim, animT: 0,
      defeatStyle: k.defeatStyle, // how it goes down; k.sawStyle ('sliced') when the chainsaw does it
    }, extra || {});
  }
  S.makeEnemy = makeEnemy; // for the render sweep and tests (a boss is only made by the arena)
  // One level entry can stand a litter: { type: 'baby', x: 3010, litter: 3 } makes three, litterGap px apart (ids e5, e5-1, e5-2),
  // each patrolling round its own spot. The default litter is 1, so every other entry is one zombie, as before.
  function makeEnemies(def, idx) {
    const n = Math.max(1, def.litter || 1), gap = typeOf(def).cfg.litterGap || 32;
    const out = [];
    for (let j = 0; j < n; j++) {
      const e = makeEnemy(def, idx, j ? { id: 'e' + idx + '-' + j } : null);
      e.x += j * gap; e.home = e.x;
      out.push(e);
    }
    return out;
  }
  S.makeEnemies = makeEnemies;
  function makeCart(def, idx) {
    return { id: 'cart' + idx, def, x: def.x, state: 'upright', t: 0, anim: 'upright', animT: 0, spill: [] };
  }
  function makePickup(def, idx) {
    return { id: 'pk' + idx, type: def.type, def, x: def.x, y: def.y, vx: 0, vy: 0,
      collected: false, spilled: false, landed: true, life: 0, t: 0 };
  }

  S.newGame = function (level) {
    const s = { level: level || S.LEVEL1, mode: 'title', t: 0, events: [], effects: [], god: false };
    resetLevel(s);
    return s;
  };

  function resetLevel(s) {
    const L = s.level;
    s.player = makePlayer(L.start.x, L.start.y);
    s.enemies = [].concat(...L.enemies.map((d, i) => makeEnemies(d, i)));
    s.carts = L.carts.map((d, i) => makeCart(d, i));
    s.pickups = L.pickups.map((d, i) => makePickup(d, i));
    s.projectiles = [];
    s.hazards = []; // floor hazards from the boss: shockwaves (kind 'wave') and acid puddles (kind 'puddle')
    s.effects = [];
    s.cps = L.checkpoints.map((c) => ({ id: c.id, x: c.x, active: false }));
    s.checkpoint = { id: 'START', x: L.start.x };
    s.arena = { state: 'idle', wave: -1, timer: 0, spawnCount: 0 };
    s.cam = { x: 0 };
    s.stats = { time: 0, defeated: 0, hotdogs: 0, hits: 0, kos: 0 };
    s.lastSafeX = L.start.x;
    s.shake = 0;
    s.hitstop = 0; // seconds of freeze-frame after a chainsaw kill (effects keep playing)
    sawLoop(s, false);
    s.clearT = 0;
    s.nextId = 1000;
  }
  S.resetLevel = resetLevel;

  // ---------- world collision ----------
  function arenaLocked(s) { return s.arena.state === 'fight' || s.arena.state === 'boss' || s.arena.state === 'open'; }

  function getSolids(s) {
    const L = s.level;
    const out = [];
    for (const g of L.ground) out.push({ kind: 'ground', x: g.x0, y: G, w: g.x1 - g.x0, h: 64 });
    for (const b of L.solids) out.push(b);
    out.push({ kind: 'wall', x: -16, y: -400, w: 16, h: 700 });
    out.push({ kind: 'wall', x: L.width, y: -400, w: 16, h: 700 });
    for (const c of s.carts) {
      const b = cartBody(c);
      if (b) out.push(b);
    }
    const A = L.arena;
    if (arenaLocked(s)) out.push({ kind: 'arena-wall', x: A.x0, y: -400, w: 8, h: 600 });
    if (s.arena.state !== 'open') out.push({ kind: 'gate', x: A.gateX, y: -400, w: A.gateW, h: 400 + G });
    return out;
  }
  function getPlatforms(s) {
    const out = s.level.platforms.slice();
    for (const c of s.carts) if (c.state === 'upright') out.push({ kind: 'umbrella', x: c.x, y: G - C.cart.h, w: C.cart.w });
    return out;
  }
  function cartBody(c) {
    if (c.state === 'upright' || c.state === 'rocking') return { kind: 'cart', x: c.x + 4, y: G - 28, w: 56, h: 28 };
    if (c.state === 'tipped' || c.state === 'empty') return { kind: 'cart', x: c.x - 8, y: G - 16, w: 80, h: 16 };
    return null; // tipping: no collision while falling
  }

  // Is there ground or a platform directly under the point (x, y)?
  function isSupported(s, x, y) {
    for (const b of getSolids(s)) if (x > b.x && x < b.x + b.w && y + 1 > b.y && y + 1 < b.y + b.h && Math.abs(b.y - y) < 2) return true;
    for (const p of getPlatforms(s)) if (x > p.x && x < p.x + p.w && Math.abs(p.y - y) < 2) return true;
    return false;
  }
  S.isSupported = isSupported;

  // Move a body (feet at e.x, e.y) with gravity and collide with the world.
  function moveBody(s, e, w, h) {
    const solids = getSolids(s);
    e.blocked = false;
    // horizontal
    e.x += e.vx * DT;
    let box = footBox(e, w, h);
    for (const b of solids) {
      if (!overlap(box, b)) continue;
      if (b.kind === 'ground' && box.y + box.h - b.y < 4) continue;
      const mid = b.x + b.w / 2;
      if (e.x < mid) e.x = b.x - w / 2; else e.x = b.x + b.w + w / 2;
      e.vx = 0; e.blocked = true;
      box = footBox(e, w, h);
    }
    // vertical
    const wasGrounded = e.grounded;
    e.vy = Math.min(e.vy + C.gravity * DT, C.maxFall);
    const prevY = e.y;
    e.y += e.vy * DT;
    e.grounded = false;
    box = footBox(e, w, h);
    for (const b of solids) {
      if (!overlap(box, b)) continue;
      if (e.vy >= 0 && prevY <= b.y + 4) { e.y = b.y; e.grounded = true; e.groundKind = b.kind; }
      else if (e.vy < 0) { e.y = b.y + b.h + h; }
      e.vy = 0;
      box = footBox(e, w, h);
    }
    if (e.vy >= 0 && !e.grounded) {
      for (const p of getPlatforms(s)) {
        if (prevY <= p.y + 0.01 && e.y >= p.y && e.x + w / 2 > p.x && e.x - w / 2 < p.x + p.w) {
          e.y = p.y; e.vy = 0; e.grounded = true; e.groundKind = p.kind;
        }
      }
    }
    return wasGrounded;
  }

  // ---------- damage ----------
  function hurtPlayer(s, opts) {
    const p = s.player;
    if (p.state === 'ko' || s.mode !== 'playing') return false;
    if (s.god) return false;
    if (p.invuln > 0) return false;
    // opts.attack: the source's own attack landed (not a bump). A type with shoveKnockX/Y throws Sammy that far instead of
    // the usual hurtKnockX/Y; one with stripsLid takes the whole lid and still throws him (the sweater's shove).
    const src = opts.attack && opts.source ? typeOf(opts.source).cfg : null;
    // opts.knockX/knockY: a bigger hit still (the Brute's swipe) wins over both.
    const knockX = opts.knockX || (src && src.shoveKnockX != null ? src.shoveKnockX : P.hurtKnockX);
    const knockY = opts.knockY || (src && src.shoveKnockY != null ? src.shoveKnockY : P.hurtKnockY);
    const dir = opts.fromX != null ? (sign(p.x - opts.fromX) || -p.face) : -p.face;
    if (src && src.shoveKnockX != null) sfx(s, 'sfx-zombie-shove');
    if (!opts.hazard && p.shield > 0) {
      p.shield = src && src.stripsLid ? 0 : p.shield - 1;
      p.invuln = 0.3;
      sfx(s, p.shield > 0 ? 'sfx-shield-block' : 'sfx-shield-break');
      effect(s, 'spark', p.x + p.face * 10, p.y - 18, 0.2);
      if (opts.source) { const push = typeOf(opts.source).cfg.shieldPush; if (push) opts.source.x += sign(opts.source.x - p.x) * push; }
      if (src && src.stripsLid) { // the lid is gone and Sammy still flies: the hurt reel, no heart lost
        if (p.state === 'playdead' || p.state === 'getup') p.possumCd = C.possum.cooldown;
        releaseConfused(s);
        p.state = 'hurt'; p.t = 0; p.vx = dir * knockX; p.vy = -knockY; p.grounded = false;
      }
      return 'blocked';
    }
    if (p.state === 'playdead' || p.state === 'getup') p.possumCd = C.possum.cooldown;
    p.hp -= 1;
    s.stats.hits += 1;
    sfx(s, 'sfx-hurt');
    releaseConfused(s);
    if (p.hp <= 0) {
      p.hp = 0; p.state = 'ko'; p.t = 0; p.vx = 0; p.shield = 0;
      s.stats.kos += 1;
      sawLoop(s, false);
      sfx(s, 'sfx-ko');
      music(s, 'stop');
      return 'ko';
    }
    p.state = 'hurt'; p.t = 0; p.invuln = P.invulnTime;
    if (!opts.hazard) { p.vx = dir * knockX; p.vy = -knockY; p.grounded = false; }
    return 'hurt';
  }
  S.hurtPlayer = hurtPlayer;

  // opts.source: 'whip' (default), 'chainsaw' or 'cart'. Gore is effect data only; render.js decides how much to show.
  function damageEnemy(s, e, fromX, opts) {
    if (e.state === 'defeat' || e.state === 'dead') return;
    const k = typeOf(e).cfg;
    const saw = !!opts && opts.source === 'chainsaw';
    const dir = sign(e.x - fromX) || 1;
    e.hp -= saw ? C.chainsaw.damage : 1;
    e.hitT = 0.25; // just hit (the boss bar's portrait winces this long)
    if (!saw) { sfx(s, 'sfx-hit-zombie'); effect(s, 'spark', e.x, e.y - 24, 0.15); }
    // Chainsaw gore starts past the blade tip and flies away from Sammy, so it never covers him.
    const gx = saw ? fromX + dir * Math.max(Math.abs(e.x - fromX), C.chainsaw.reach + 12) : e.x;
    const big = saw && k.sawHitstop; // gore overload (owner answer 7): a boss throws the most blood and chunks on every cut, with hit-stop and shake
    effect(s, 'blood', gx, e.y - 24, 0.6, { n: big ? 14 : saw ? 8 : 4, dir, power: big ? 2.5 : saw ? 2 : 1 });
    if (k.sawHitstop) sfx(s, 'sfx-boss-hit');
    if (big) {
      for (let i = 0; i < k.sawChunks; i++) effect(s, 'chunk', gx, e.y - 36 + i * 10, 0.9, { dir, i });
      s.hitstop = Math.max(s.hitstop || 0, k.sawHitstop);
      s.shake = Math.max(s.shake, 0.15);
    }
    if (e.hp <= 0) {
      e.state = 'defeat'; e.t = 0; e.vx = 0; e.confused = false;
      e.defeatStyle = saw ? k.sawStyle : k.defeatStyle;
      e.sliceDir = dir; // the cut top half slides this way (away from Sammy)
      s.stats.defeated += 1;
      sfx(s, 'sfx-zombie-defeat-comedic');
      if (k.defeatSfx) sfx(s, k.defeatSfx); // a sound of its own (the baby's cry)
      sfx(s, 'sfx-gore-splat');
      effect(s, 'ichor', gx, e.y - (saw ? 22 : 36), 0.8, { n: saw ? 10 : 6 });
      if (saw) {
        for (let i = 0; i < 3; i++) effect(s, 'chunk', gx, e.y - 30 + i * 8, 0.9, { dir, i });
        s.hitstop = Math.max(s.hitstop || 0, 0.06);
        s.shake = Math.max(s.shake, 0.25);
      } else if (k.pool) {
        // Melts into a goo pool (the hippie): a drawing-only effect under him that outlives the body; never from the saw.
        effect(s, 'melt-pool', e.x, e.y, k.pool, { type: e.type, melt: k.defeatTime });
        sfx(s, 'sfx-zombie-melt');
      }
      return;
    }
    // flinch: false (the big ones, the bosses): the hit flashes it white for hitReactTime and changes nothing else; it keeps coming.
    if (!k.flinch) { e.flashT = k.hitReactTime; return; }
    e.state = 'hitreact'; e.t = 0;
    e.vx = dir * (saw ? k.sawKnockback : k.knockback);
  }

  function releaseConfused(s) {
    for (const e of s.enemies) {
      if (!e.confused) continue;
      e.confused = false;
      if (e.state === 'confused' || e.state === 'sniff') { e.state = typeOf(e).resume; e.home = e.x; e.t = 0; }
      e.ignoreT = typeOf(e).cfg.possumIgnore; // lost interest: won't re-notice Sammy straight away
      if (e.state === 'shrug') { e.state = 'idle'; e.t = 0; }
    }
  }

  // ---------- player ----------
  function anyPressed(inp) {
    const q = inp.pressed;
    return q.jump || q.attack || q.possum || q.left || q.right;
  }

  function startPossum(s) {
    const p = s.player;
    p.state = 'playdead'; p.t = 0; p.vx = 0;
    sfx(s, 'sfx-play-dead');
    for (const e of s.enemies) {
      if (e.state === 'defeat' || e.state === 'dead') continue;
      const how = typeOf(e).cfg.possum;
      if (how === 'ignore') continue; // never fooled (the baby): it keeps coming, and a bump still hurts
      if (Math.abs(e.x - p.x) <= C.possum.radius && Math.abs(e.y - p.y) < 48) {
        e.confused = true;
        // An attack or a leap already started still finishes (a leap frozen in mid-air would look wrong); it goes confused on landing.
        // A brain with a `confusable` list (the boss) says itself which states Play Possum may interrupt.
        const T = typeOf(e);
        const free = T.confusable ? T.confusable.includes(e.state) : !['attack', 'hitreact', 'leap', 'land'].includes(e.state);
        if (how === 'confused' && free) { e.state = 'confused'; e.t = 0; e.vx = 0; }
        if (how === 'sniff' && free) { e.state = 'sniff'; e.t = 0; }
        if (how === 'shrug' && e.state !== 'hitreact') { e.state = 'shrug'; e.t = 0; }
      }
    }
  }

  function updatePlayer(s, inp) {
    const p = s.player;
    p.invuln = Math.max(0, p.invuln - DT);
    const cdBefore = p.possumCd;
    p.possumCd = Math.max(0, p.possumCd - DT);
    p.possumFlash = Math.max(0, p.possumFlash - DT);
    if (cdBefore > 0 && p.possumCd === 0) p.possumFlash = C.possum.readyFlash; // HUD icon flashes: ready again
    p.landT = Math.max(0, p.landT - DT);
    p.t += DT;

    if (p.state === 'ko') {
      p.vx = 0;
      moveBody(s, p, P.deadW, P.deadH);
      if (p.t >= P.koTime + P.koWait) respawn(s);
      return;
    }

    const h = inp.held;
    if (inp.pressed.jump) p.buffer = P.jumpBuffer; else p.buffer = Math.max(0, p.buffer - DT);

    if (p.state === 'hurt' && p.t >= P.hurtTime) { p.state = 'normal'; p.t = 0; }
    if (p.state === 'playdead') {
      p.vx = 0;
      if (p.t >= C.possum.maxTime || (p.t >= C.possum.minTime && anyPressed(inp))) { p.state = 'getup'; p.t = 0; p.buffer = 0; }
    } else if (p.state === 'getup') {
      p.vx = 0;
      if (p.t >= C.possum.getUpTime) { p.state = 'normal'; p.t = 0; p.possumCd = C.possum.cooldown; releaseConfused(s); }
    }

    const canControl = p.state === 'normal' || p.state === 'attack';
    if (p.saw) updateSaw(s, p, inp, canControl);
    if (canControl) {
      const dir = (h.right ? 1 : 0) - (h.left ? 1 : 0);
      const slow = (p.state === 'attack' && p.grounded ? 0.3 : 1) * (p.saw && p.saw.revving ? C.chainsaw.slow : 1);
      const target = dir * P.runSpeed * slow;
      const rate = dir !== 0 ? P.accel : P.decel;
      if (p.vx < target) p.vx = Math.min(target, p.vx + rate * DT);
      else if (p.vx > target) p.vx = Math.max(target, p.vx - rate * DT);
      if (dir !== 0 && p.state !== 'attack') p.face = dir;

      if (p.buffer > 0 && (p.grounded || p.coyote > 0)) {
        p.vy = -P.jumpSpeed; p.grounded = false; p.coyote = 0; p.buffer = 0;
        sfx(s, 'sfx-jump');
      }
      if (!h.jump && p.vy < -P.jumpCutSpeed) p.vy = -P.jumpCutSpeed;

      if (inp.pressed.attack && p.state === 'normal' && !p.saw) { // with the chainsaw, the same button revs it instead
        p.state = 'attack'; p.t = 0; p.hitSet = new Set();
        sfx(s, 'sfx-tail-whip');
      } else if (inp.pressed.possum && p.state === 'normal' && p.grounded && p.possumCd <= 0) {
        startPossum(s);
      }
    } else if (p.state === 'hurt') {
      p.vx *= 0.92;
    }

    if (p.state === 'attack') {
      if (p.t >= P.attackHitStart && p.t < P.attackHitEnd) whipHits(s);
      if (p.t >= P.attackTime) { p.state = 'normal'; p.t = 0; }
    }

    const fallSpeed = p.vy;
    const box = playerBox(p);
    const wasGrounded = moveBody(s, p, box.w, box.h);
    if (!wasGrounded && p.grounded && fallSpeed > 150) { p.landT = P.landTime; sfx(s, 'sfx-land'); effect(s, 'dust', p.x, p.y, 0.2); }
    p.coyote = p.grounded ? P.coyoteTime : Math.max(0, p.coyote - DT);

    // Can't walk back off the left of the screen (no backtracking past the camera).
    const minX = s.cam.x + 8;
    if (p.x < minX) { p.x = minX; if (p.vx < 0) p.vx = 0; }

    // Remember the last safe spot on solid ground: not within 24 px of the pond or the edge of a pit.
    if (p.grounded && p.groundKind === 'ground' && isSupported(s, p.x, p.y)) {
      const L = s.level;
      let nearHole = false;
      for (const w of L.water) if (p.x > w.x0 - 24 && p.x < w.x1 + 24) nearHole = true;
      for (const g of L.ground) {
        if (g.x0 > 0 && Math.abs(p.x - g.x0) < 24) nearHole = true;
        if (g.x1 < L.width && Math.abs(p.x - g.x1) < 24) nearHole = true;
      }
      if (!nearHole) s.lastSafeX = p.x;
    }
    // Pond water (splash) or falling out of the world (no splash). Both cost a heart.
    let pond = null;
    for (const w of s.level.water) if (p.x > w.x0 && p.x < w.x1 && p.y >= w.y) pond = w;
    if (pond || p.y > 260) {
      if (pond) { sfx(s, 'sfx-splash'); effect(s, 'splash', clamp(p.x, pond.x0, pond.x1), pond.y, 0.4); }
      const result = hurtPlayer(s, { hazard: true });
      if (result !== 'ko') {
        p.x = s.lastSafeX; p.y = G; p.vx = 0; p.vy = 0; p.grounded = true; p.groundKind = 'ground';
        if (p.state === 'normal' || p.state === 'hurt') { p.state = 'hurt'; p.t = 0; }
        p.invuln = Math.max(p.invuln, P.invulnTime);
      } else {
        p.y = G; p.x = s.lastSafeX;
      }
    }
  }

  function whipHits(s) {
    const p = s.player;
    const r = { x: p.face > 0 ? p.x + 6 : p.x - 6 - P.whipW, y: p.y - 22, w: P.whipW, h: P.whipH };
    s.lastWhip = r;
    for (const e of s.enemies) {
      if (e.state === 'defeat' || e.state === 'dead' || p.hitSet.has(e.id)) continue;
      const k = typeOf(e).cfg;
      if (overlap(r, footBox(e, k.bodyW, k.bodyH))) { p.hitSet.add(e.id); damageEnemy(s, e, p.x, { source: 'whip' }); }
    }
    for (const c of s.carts) {
      if (p.hitSet.has(c.id)) continue;
      if (overlap(r, { x: c.x, y: G - C.cart.h, w: C.cart.w, h: C.cart.h })) { p.hitSet.add(c.id); hitCart(s, c); }
    }
  }

  // ---------- chainsaw ----------
  // Holding the attack button revs it (a tap revs for slashTime). Revving burns 1 fuel per second, carrying it burns
  // carryDrain. While revving it cuts whatever is in reach every `tick` seconds. Empty tank: it's gone, back to the whip.
  function updateSaw(s, p, inp, canControl) {
    const K = C.chainsaw, w = p.saw;
    w.slash = Math.max(0, (w.slash || 0) - DT);
    if (canControl && inp.pressed.attack) w.slash = K.slashTime;
    const rev = canControl && (inp.held.attack || w.slash > 0) && w.fuel > 0;
    if (rev && !w.revving) w.tick = 0; // first cut straight away
    w.revving = rev;
    w.fuel = Math.max(0, w.fuel - (rev ? 1 : K.carryDrain) * DT);
    if (rev) {
      w.tick -= DT;
      if (w.tick <= 0) { w.tick += K.tick; sawCut(s, p); }
    }
    if (w.fuel <= 0) {
      p.saw = null;
      effect(s, 'text', p.x, p.y - 44, 1.2, { text: 'OUT OF GAS. SHIT.' });
    }
    sawLoop(s, !!(p.saw && p.saw.revving));
  }

  function sawCut(s, p) {
    const K = C.chainsaw;
    const r = { x: p.face > 0 ? p.x : p.x - K.reach, y: p.y - 24, w: K.reach, h: 18 };
    s.lastSaw = r;
    let cut = false;
    for (const e of s.enemies) {
      if (e.state === 'defeat' || e.state === 'dead' || e.state === 'spawn') continue;
      const k = typeOf(e).cfg;
      if (overlap(r, footBox(e, k.bodyW, k.bodyH))) { damageEnemy(s, e, p.x, { source: 'chainsaw' }); cut = true; }
    }
    for (const c of s.carts) {
      if ((c.state === 'upright' || c.state === 'rocking') && overlap(r, { x: c.x, y: G - C.cart.h, w: C.cart.w, h: C.cart.h })) { hitCart(s, c); cut = true; }
    }
    if (cut) {
      sfx(s, 'sfx-chainsaw-cut');
      effect(s, 'sparks', p.x + p.face * Math.round(K.reach * 0.7), p.y - 16, 0.15, { dir: p.face });
    }
  }

  function respawn(s) {
    const cp = s.checkpoint;
    const L = s.level;
    s.player = makePlayer(cp.x, G);
    s.player.invuln = 1.0;
    s.enemies = s.enemies.filter((e) => !e.arena && e.def.x <= cp.x);
    L.enemies.forEach((d, i) => { if (d.x > cp.x) s.enemies.push(...makeEnemies(d, i)); });
    s.carts = s.carts.map((c, i) => (c.def.x > cp.x ? makeCart(c.def, i) : c));
    s.pickups = s.pickups.filter((pk) => !pk.spilled);
    for (const pk of s.pickups) if (pk.def.x > cp.x) pk.collected = false;
    s.projectiles = [];
    s.hazards = [];
    s.arena = { state: 'idle', wave: -1, timer: 0, spawnCount: 0 };
    s.lastSafeX = cp.x;
    s.cam.x = clamp(cp.x - 64, 0, L.width - C.screenW);
    music(s, 'level');
    s.events.push({ type: 'respawn', id: cp.id });
  }

  // ---------- enemies ----------
  function playerHidden(p) { return p.state === 'playdead' || p.state === 'getup'; }

  // The "walker" brain (jogger, hippie, sweater, cheerleader, baby): patrol near home, notice Sammy, chase, lunge, reel, go down.
  // Every number comes from the type's config block (J); the type's hooks are its flags (flinch, possum, knockback…).
  function updateWalker(s, e) {
    const J = typeOf(e).cfg;
    const p = s.player;
    e.t += DT; e.cd = Math.max(0, e.cd - DT); e.ignoreT = Math.max(0, (e.ignoreT || 0) - DT);
    const dx = p.x - e.x, dy = p.y - e.y;
    // A type that ignores Play Possum notices a lying Sammy like a standing one.
    const canNotice = p.state !== 'ko' && (J.possum === 'ignore' || !playerHidden(p)) && e.ignoreT <= 0 && Math.abs(dx) <= J.notice && Math.abs(dy) < 40;
    const aheadSupported = () => !e.grounded || isSupported(s, e.x + e.face * (J.bodyW / 2 + 2), e.y);
    const fooled = J.possum === 'sniff' ? 'sniff' : 'confused'; // where it settles when Play Possum has it and an attack or reel ends
    const reach = J.leap ? J.leapRange : J.attackRange; // how close it gets before its attack (or its leap)

    switch (e.state) {
      case 'patrol': {
        e.face = e.dir;
        e.vx = e.dir * J.patrolSpeed;
        if ((e.x <= e.home - J.patrolRange && e.dir < 0) || (e.x >= e.home + J.patrolRange && e.dir > 0) || !aheadSupported() || e.blocked) {
          e.dir = -e.dir; e.face = e.dir; e.vx = e.dir * J.patrolSpeed;
        }
        if (canNotice) { e.state = 'chase'; e.t = 0; e.lostT = 0; effect(s, 'bang', e.x, e.y - 44, 0.5); if (s.t - (s.groanT || -9) > 1.5) { s.groanT = s.t; sfx(s, 'sfx-zombie-groan'); } }
        break;
      }
      case 'chase': {
        if (p.state === 'ko') { e.state = 'patrol'; e.home = e.x; break; }
        if (Math.abs(dx) > 2) e.face = sign(dx);
        e.vx = Math.abs(dx) > reach - 6 ? e.face * J.chaseSpeed : 0;
        if (!aheadSupported()) e.vx = 0;
        if (Math.abs(dx) > J.giveUpDist && !e.arena) { e.lostT += DT; if (e.lostT > J.giveUpTime) { e.state = 'patrol'; e.home = e.x; } }
        else e.lostT = 0;
        if (Math.abs(dx) <= reach && Math.abs(dy) < 30 && e.cd <= 0 && e.grounded) {
          if (J.leap) {
            // Only where the landing spot is ground (never into the pond or off a ledge) and nothing solid stands in the way.
            if (leapClear(s, e, J)) { e.state = 'windup'; e.t = 0; e.vx = 0; sfx(s, 'sfx-cheer'); }
          } else { e.state = 'attack'; e.t = 0; e.attackHit = false; e.vx = 0; if (J.attackSfx) sfx(s, J.attackSfx); }
        }
        break;
      }
      // The leap (cheerleader): windup = she stops and cheers (harmless tell), leap = airborne and hurts on touch, land = stuck, harmless.
      case 'windup': {
        e.vx = 0;
        if (Math.abs(dx) > 2) e.face = sign(dx);
        if (e.t >= J.leapWindup) { e.state = 'leap'; e.t = 0; e.vx = e.face * J.leapVx; e.vy = -J.leapVy; e.grounded = false; sfx(s, 'sfx-leap'); }
        break;
      }
      case 'leap': {
        if (e.blocked) e.vx = 0; // hit a wall: drop straight down
        if ((e.grounded && e.t > DT * 2) || e.t >= J.leapMaxAir) { e.state = 'land'; e.t = 0; e.vx = 0; }
        break;
      }
      case 'land': {
        e.vx = 0;
        if (e.t >= J.leapLand) { e.state = e.confused ? fooled : 'chase'; e.t = 0; e.cd = J.leapCooldown; }
        break;
      }
      case 'attack': {
        e.vx = 0;
        if (e.t >= J.attackHitStart && e.t < J.attackHitEnd && !e.attackHit) {
          const r = { x: e.face > 0 ? e.x + 4 : e.x - 4 - J.hitW, y: e.y - J.hitY, w: J.hitW, h: J.hitH };
          if (overlap(r, playerBox(p))) { e.attackHit = true; hurtPlayer(s, { fromX: e.x, source: e, attack: true }); }
        }
        if (e.t >= J.attackTime) { e.state = e.confused ? fooled : 'chase'; e.t = 0; e.cd = J.attackCooldown; }
        break;
      }
      case 'hitreact': {
        e.vx *= 0.85;
        if (e.t >= J.hitReactTime) { e.state = e.confused ? fooled : 'chase'; e.t = 0; e.cd = Math.max(e.cd, 0.4); }
        break;
      }
      case 'spawn': e.vx = 0; if (e.grounded && e.t > 0.6) { e.state = 'chase'; e.t = 0; } break;
      case 'confused': e.vx = 0; break;
      case 'sniff': {
        // Fooled, but curious: shambles toward the lying Sammy at patrol speed, stops sniffStop px short (or at a ledge or a
        // wall), faces him and stands there (confused) until he gets up. Touching him never hurts in this state.
        if (Math.abs(dx) > 2) e.face = sign(dx);
        if (Math.abs(dx) <= J.sniffStop || !aheadSupported() || e.blocked) { e.state = 'confused'; e.t = 0; e.vx = 0; sfx(s, 'sfx-zombie-sniff'); }
        else e.vx = e.face * J.patrolSpeed;
        break;
      }
      case 'defeat': e.vx = 0; if (e.t >= J.defeatTime) e.state = 'dead'; break;
    }
    // Touching a zombie that is walking, attacking or leaping hurts (not while it reels back, is confused, winds up or lands).
    if ((e.state === 'patrol' || e.state === 'chase' || e.state === 'attack' || e.state === 'leap') && overlap(footBox(e, J.bodyW, J.bodyH), playerBox(p))) {
      hurtPlayer(s, { fromX: e.x, source: e });
    }
    if (e.state !== 'dead') moveBody(s, e, J.bodyW, J.bodyH);
    if (e.y > 260) e.state = 'dead';
    setAnim(e, BRAINS.walker.anims[e.state]);
  }

  // How far a leap carries on flat ground: leapVx for the time gravity takes to bring leapVy back down (about 72 px for the cheerleader).
  const leapLength = (J) => J.leapVx * (2 * J.leapVy / C.gravity);
  S.leapLength = leapLength;
  // Is the leap worth taking: the landing spot is ground, and no rock, fence, cart or gate stands in the lane she flies through.
  function leapClear(s, e, J) {
    const len = leapLength(J), landX = e.x + e.face * len;
    if (!isSupported(s, landX, e.y)) return false;
    const lane = { x: Math.min(e.x, landX) - J.bodyW / 2, y: e.y - J.bodyH, w: len + J.bodyW, h: J.bodyH - 2 };
    for (const b of getSolids(s)) if (b.kind !== 'ground' && overlap(lane, b)) return false;
    return true;
  }

  // The "turret" brain (the hot dog vendor): stands still, faces Sammy, throws when he is in range, shrugs at Play Possum.
  function updateTurret(s, e) {
    const V = typeOf(e).cfg;
    const p = s.player;
    e.t += DT;
    const dx = p.x - e.x;
    const inRange = Math.abs(dx) <= V.notice && p.state !== 'ko';
    switch (e.state) {
      case 'idle':
        if (inRange) e.face = sign(dx) || e.face;
        e.throwT -= DT;
        if (inRange && e.throwT <= 0) { e.state = 'throw'; e.t = 0; e.released = false; }
        break;
      case 'throw':
        if (e.t >= V.releaseAt && !e.released) { e.released = true; throwHotDog(s, e); }
        if (e.t >= V.throwTime) { e.state = e.confused ? 'shrug' : 'idle'; e.t = 0; e.throwT = V.throwEvery; }
        break;
      case 'hitreact':
        if (e.t >= V.hitReactTime) { e.state = e.confused ? 'shrug' : 'idle'; e.t = 0; e.throwT = Math.max(e.throwT, 0.8); }
        break;
      case 'shrug': break;
      case 'defeat': if (e.t >= V.defeatTime) e.state = 'dead'; break;
    }
    e.vx = 0;
    if (e.state !== 'dead') moveBody(s, e, V.bodyW, V.bodyH);
    setAnim(e, BRAINS.turret.anims[e.state]);
  }

  // The "boss" brain (the Brute): walks at Sammy and picks an attack by distance and a fixed count, never by chance. Every attack
  // is a tell (a held pose with its own sound), the hit, then an opening (a held pose: safe to touch, the time to hit him).
  // He never flinches; the chainsaw cuts him any time (owner answer 7). Half health = a stagger, enrageAt = the enrage roar: both free
  // openings. Play Possum confuses him until Sammy gets up (an attack already started finishes first), then he ignores Sammy for a moment.
  const TELL_SFX = { swipe: 'sfx-boss-grunt', slam: 'sfx-boss-chains', spin: 'sfx-boss-roar', vomit: 'sfx-boss-gurgle' };
  function updateBoss(s, e) {
    const B = typeOf(e).cfg, E = B.enraged, p = s.player, A = s.level.arena, L = B.lines || {};
    e.t += DT; e.slamCd = Math.max(0, (e.slamCd || 0) - DT); e.ignoreT = Math.max(0, (e.ignoreT || 0) - DT);
    const dx = p.x - e.x, enr = !!e.enraged;
    const tellOf = (t) => (enr ? t * E.tellScale : t);
    const openOf = (t) => (enr ? t * E.openScale : t);
    const go = (st) => { e.state = st; e.t = 0; e.vx = 0; e.attackHit = false; };
    // After an attack, an opening or a stagger: back to walking (deciding at once), or confused if Sammy played dead meanwhile.
    const resume = () => { if (e.confused) go('confused'); else { go('walk'); e.decideT = 0; } };
    // A hit box in front of him (x0..x1 ahead of his feet, y0..y1 up from the ground), or centred on him for both sides.
    const box = (b, both) => (both ? { x: e.x - b.x1, y: e.y - b.y1, w: 2 * b.x1, h: b.y1 - b.y0 }
      : { x: e.face > 0 ? e.x + b.x0 : e.x - b.x1, y: e.y - b.y1, w: b.x1 - b.x0, h: b.y1 - b.y0 });
    const strike = (r, extra) => {
      if (e.attackHit || !overlap(r, playerBox(p))) return;
      if (hurtPlayer(s, Object.assign({ fromX: e.x, source: e }, extra || {}))) e.attackHit = true;
    };
    const shockwaves = () => {
      const w = B.slam.wave;
      for (const dir of [-1, 1]) s.hazards.push({ kind: 'wave', x: e.x, dir, speed: w.speed, w: w.w, h: w.h, t: 0, life: w.life });
    };
    const puddles = () => {
      const life = enr ? E.puddleLife : B.vomit.puddleLife;
      for (const d of B.vomit.puddles) {
        const x = clamp(e.x + e.face * d, A.x0 + 8 + B.vomit.puddleW / 2, A.gateX - B.vomit.puddleW / 2);
        s.hazards.push({ kind: 'puddle', x, w: B.vomit.puddleW, t: 0, land: B.vomit.puddleLand, life });
      }
    };
    // Which attack now? Every Nth is a vomit; Sammy behind him = spin; close in front = swipe; mid range = slam (off cooldown, or
    // whenever he has walked too long without one); else keep walking.
    const pick = () => {
      const n = (e.attacks || 0) + 1, front = dx === 0 || sign(dx) === e.face, ax = Math.abs(dx);
      let a = null;
      if (n % (enr ? E.vomitEvery : B.vomit.every) === 0) a = 'vomit';
      else if (!front && ax <= B.spin.range) a = 'spin';
      else if (front && ax <= B.swipe.range) a = 'swipe';
      else if ((ax <= B.slam.range && e.slamCd <= 0) || e.walkT >= B.walkMax) a = 'slam';
      if (!a) return null;
      e.attacks = n; e.walkT = 0;
      if (a !== 'spin' && dx !== 0) e.face = sign(dx);
      e.tells = (e.tells || 0) + 1;
      if (L.taunts && L.taunts.length && e.tells % 3 === 0) effect(s, 'text', e.x, e.y - B.bodyH - 12, 1.0, { text: L.taunts[(e.tells / 3 - 1) % L.taunts.length] });
      go(a + '-tell'); sfx(s, TELL_SFX[a]);
      return a;
    };

    // Phase changes interrupt anything but his death and each other: half health = the stagger, enrageAt = the enrage roar.
    const busy = e.state === 'defeat' || e.state === 'dead' || e.state === 'stagger' || e.state === 'enrage';
    if (!busy && !e.staggered && e.hp <= B.staggerAt) { e.staggered = true; go('stagger'); sfx(s, 'sfx-boss-grunt'); }
    else if (!busy && !e.enraged && e.hp <= B.enrageAt) {
      e.enraged = true; go('enrage'); sfx(s, 'sfx-boss-roar'); s.shake = Math.max(s.shake, 0.4);
      if (L.enrage) effect(s, 'text', (A.x0 + A.x1) / 2, 60, 1.5, { text: L.enrage });
    }
    // The enraged slam's second pair of shockwaves follows the first after a gap.
    if (e.waveT > 0) { e.waveT -= DT; if (e.waveT <= 0) shockwaves(); }

    switch (e.state) {
      case 'enter': // out of the arch toward the camera, then a roar with his arms wide
        if (e.t < B.enterWalk) { e.face = -1; e.vx = -B.walkSpeed; }
        else { e.vx = 0; if (!e.roared) { e.roared = true; sfx(s, 'sfx-boss-roar'); s.shake = Math.max(s.shake, 0.3); } if (dx !== 0) e.face = sign(dx); }
        if (e.t >= B.enterWalk + B.enterRoar) resume();
        break;
      case 'walk': {
        if (e.ignoreT > 0 || p.state === 'ko') { e.vx = 0; e.decideT = 0; break; } // just fooled by Play Possum: looks around a moment
        e.walkT = (e.walkT || 0) + DT; e.decideT = (e.decideT || 0) - DT;
        if (e.decideT <= 0) { e.decideT = B.decideEvery; if (pick()) break; }
        if (Math.abs(dx) > 2) e.face = sign(dx);
        e.vx = Math.abs(dx) > B.bodyW / 2 ? e.face * (enr ? E.walkSpeed : B.walkSpeed) : 0;
        break;
      }
      case 'swipe-tell': if (e.t >= tellOf(B.swipe.tell)) { go('swipe-step'); e.vx = e.face * ((enr ? E.swipeStep : B.swipe.step) / B.swipe.stepTime); } break;
      case 'swipe-step': if (e.t >= B.swipe.stepTime) { go('swipe-hit'); sfx(s, 'sfx-boss-swipe'); } break;
      case 'swipe-hit': strike(box(B.swipe.box), { knockX: B.swipe.knockX, knockY: B.swipe.knockY }); if (e.t >= B.swipe.hits) go('swipe-open'); break;

  // ---------- turning the pieces into canvases ----------
  const cache = {};
  const manifestFor = {};
  for (const m of S.ASSET_MANIFEST) if (m.key.startsWith('scenery:')) manifestFor[m.key] = m;
  function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  // The picture to stamp for a scenery key: the real art when it loaded, else the coded placeholder. Null where there is no canvas.
  function piece(key) {
    const real = S.images[key];
    if (real) return real;
    if (!hasDom || !GEN[key]) return null;
    if (!cache[key]) {
      const m = manifestFor[key], cv = makeCanvas(m.fw * m.frames, m.fh), g = cv.getContext('2d');
      for (let f = 0; f < m.frames; f++) { const b = new Buf(m.fw, m.fh); GEN[key](b, f); b.flush(g, f * m.fw, 0); }
      cache[key] = Object.assign({ img: cv, placeholder: true }, m);
    }
    return cache[key];
  }
  S.sceneryPiece = piece;
  S.sceneryPlaceholderKeys = () => Object.keys(GEN);
  // Stamp frame f of a piece with its pivot at (x, y). Feet pieces: the pivot row sits just above y, like sprites.
  function blit(ctx, key, f, x, y, clipX0, clipX1) {
    const m = piece(key);
    if (!m) return false;
    if (!m.placeholder) (S.spriteDraws = S.spriteDraws || {})[key] = (S.spriteDraws[key] || 0) + 1;
    const dx = Math.round(x) - m.px, dy = Math.round(y) - m.py - (m.feet ? 1 : 0);
    const a = clipX0 == null ? 0 : Math.max(0, clipX0 - dx), z = clipX1 == null ? m.fw : Math.min(m.fw, clipX1 - dx);
    if (z <= a) return true;
    ctx.drawImage(m.img, Math.min(f, m.frames - 1) * m.fw + a, 0, z - a, m.fh, dx + a, dy, z - a, m.fh);

      if (Math.floor(pk.t * 3) % 2 === 0) R(ctx, K.white, x + 10, y - 7, 2, 1); // glint
    }
  }

  // Enemies and Sammy: real sprite or placeholder first, then the state marks (?, !, gag text…) on top of either.
  // How a zombie goes down: e.defeatStyle from the rules (the type's defeatStyle, or its sawStyle when the chainsaw did it).
  const defeated = (e) => e.state === 'defeat' || e.state === 'dead';
  const styleOf = (e) => e.defeatStyle || S.enemyType(e.type).cfg.defeatStyle;
  // Hit flash: while it reels back (hitreact), or for a type that doesn't flinch, while its flashT runs.
  const flashing = (e) => e.state === 'hitreact' || (e.flashT || 0) > 0;
  const hashId = (id) => { let h = 0; for (const ch of String(id || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
  // Deadpan one-liners over a zombie as it goes down. Picked from its id, so the same zombie always says the same thing.
  // Keyed by defeat style; GAGS_BY_TYPE[type][style] wins over the shared list when a type has its own lines (16 characters max).
  const GAGS = {
    pop: ['POP.', 'BOINK.', 'NOPE.'],
    deflate: ['PFFFT.', 'SAD HISS.', 'FFFFFT.'],
    sliced: ['RIIIP.', 'WELL, SHIT.', 'HALVSIES.', 'FUCK ME.'],
    low: ['SHHK.', 'WELL, SHIT.', 'DONE.'],
    crawl: ['DOWN. STAYS DOWN.'], // a boss: shown when he goes flat, not when he drops
  };
  const GAGS_BY_TYPE = { // a type's own lines by style; anything not listed here falls back to GAGS by style
    hippie: { melt: ['PEACE. OUT.', 'FAR OUT, MAN.', 'BUMMER.'] },
    sweater: { flop: ['BUNNY DOWN.', 'FASHION VICTIM.', 'NICE SWEATER.'] },
    cheerleader: { burst: ['GO TEAM. DEAD.', 'RAH RAH. SHIT.', 'SPIRIT: ZERO.'] },
    baby: { pop: ['NAP TIME.', 'LITTLE SHIT.', 'GOO GOO. GONE.'] },
    brute: { crawl: ['BIG FUCKER DOWN.'] },
  };
  S.GAGS = GAGS; S.GAGS_BY_TYPE = GAGS_BY_TYPE;
  // Gags drawn this frame (reset in S.render), so several kills at once stack instead of printing over each other.
  let gagsShown = [], camNow = 0;
  function gag(ctx, e, style, y) {
    if (e.t > 0.6) return;
    const key = style === 'sliced' && S.gore === 'low' ? 'low' : style;
    const own = GAGS_BY_TYPE[e.type];
    const list = (own && own[key]) || GAGS[key] || GAGS.pop;
    const txt = list[hashId(e.id) % list.length], w = S.textWidth(txt);
    // Keep the whole word on screen, even for a kill right at the arena wall.
    const cx = Math.round(Math.max(camNow + w / 2 + 2, Math.min(camNow + W - w / 2 - 2, e.x)));
    let ty = y - Math.round(e.t * 12);
    for (let bumped = true; bumped;) {
      bumped = false;
      for (const g of gagsShown) if (Math.abs(g.x - cx) < 40 + (g.w + w) / 2 && Math.abs(g.y - ty) < 8) { ty = g.y - 8; bumped = true; }
    }
    gagsShown.push({ x: cx, y: ty, w });
    const red = style === 'sliced' && S.gore !== 'low';
    if (red) for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1], [1, 1]]) S.drawTextCentered(ctx, txt, cx + dx, ty + dy, K.black); // full outline: readable over blood
    S.drawTextCentered(ctx, txt, cx, ty, red ? K.heart : K.white, 1, red ? null : K.black);
  }
  // Chainsaw kill: the standing pose cut at the waist. Full gore: the top half slides off and falls, red cut faces and
  // drips. Low gore: no split; the whole zombie sinks into the ground in a grey puff.
  function drawSliced(ctx, e, drawPose, height) {
    const x = Math.round(e.x), y = Math.round(e.y), t = e.t, f = -(e.sliceDir || -(e.face || 1));
    const cut = y - Math.round(height * 0.5);
    if (S.gore === 'low') {
      const sink = Math.min(height, Math.round(t * height * 2.2));
      ctx.save(); ctx.beginPath(); ctx.rect(x - 40, y - 80, 80, 80); ctx.clip();
      ctx.translate(0, sink); drawPose(); ctx.restore();
      for (let i = -2; i <= 2; i++) R(ctx, LOWPUFF[i & 1], x + i * (5 + t * 12) - 2, y - 4 - t * 10 - (i & 1) * 3, 4, 4);
      return;
    }
    // Bottom half stays a moment, then buckles.
    const buckle = Math.round(Math.max(0, t - 0.25) * 40);
    ctx.save(); ctx.beginPath(); ctx.rect(x - 40, cut, 80, y - cut); ctx.clip();
    ctx.translate(0, buckle); drawPose(); ctx.restore();
    R(ctx, GORE.blood, x - 8, cut + buckle, 16, 2);
    // Top half: slides back off the cut, then falls.
    const dx = Math.round(-f * (t * 40)), top = Math.min(Math.round(Math.max(0, t - 0.1) ** 2 * gravity), y - cut - 4);
    ctx.save(); ctx.beginPath(); ctx.rect(x - 40 + dx, cut - 80 + top, 80, 80); ctx.clip();
    ctx.translate(dx, top); drawPose(); ctx.restore();
    R(ctx, GORE.bloodHi, x - 8 + dx, cut - 2 + top, 16, 2);
    // Drips from the bottom half's cut face.
    for (let i = 0; i < 4; i++) {
      const dl = Math.min(y - cut - buckle - 2, Math.round(t * 30 + rnd(i + 3) * 6));
      if (dl > 0) R(ctx, i & 1 ? GORE.bloodDark : GORE.blood, x - 6 + i * 4, cut + buckle + 2, 1, dl);
    }
    // Spreading pool.
    const pool = Math.min(26, Math.round(t * 50));
    R(ctx, GORE.bloodDark, x - pool / 2, y - 1, pool, 2);
  }

  function drawJogger(ctx, e) {
    const flash = flashing(e), style = styleOf(e), x = Math.round(e.x), y = Math.round(e.y);

    } else if (!sprite(ctx, 'jogger:' + e.anim, e.animT, e.x, e.y, e.face, false, null, flash)) drawJoggerPlaceholder(ctx, e, flash);

  }

  // standing: draw the upright pose even while defeated (the chainsaw cut uses it).
  function drawJoggerPlaceholder(ctx, e, flash, standing) {

  }

  function drawVendor(ctx, e) {

  function drawVendorPlaceholder(ctx, e, flash, standing) {

  // Coded placeholder figures with one clean 1 px outline round the whole silhouette: every block is first drawn in black one
  // pixel bigger, then in its colour (flash = every colour block white, the outline stays). blocks: [colour, x, y, w, h].
  function figure(ctx, blocks, flash) {
    for (const b of blocks) R(ctx, K.black, b[1] - 1, b[2] - 1, b[3] + 2, b[4] + 2);
    for (const b of blocks) R(ctx, flash ? K.white : b[0], b[1], b[2], b[3], b[4]);
  }
  // Marks over a walker: ? while Play Possum has it (confused, or the sweater's sniff walk-up), ! while it drops into the arena.
  function walkerMarks(ctx, e, x, y) {
    if (e.state === 'confused' || e.state === 'sniff') S.drawTextCentered(ctx, '?', x, y, K.white, 2, K.black);
    if (e.state === 'spawn') S.drawTextCentered(ctx, '!', x, y, K.heart, 2, K.black);
  }

  // ---------- hippie: purple and olive, 45 px, melts into goo ----------
  function drawHippie(ctx, e) {
    const flash = flashing(e), style = styleOf(e), x = Math.round(e.x), y = Math.round(e.y);
    if (defeated(e) && style === 'sliced') {

  // standing: the upright pose even while defeated (the chainsaw cut uses it). The melt sinks the pose into the ground; the

  function drawHippiePlaceholder(ctx, e, flash, standing) {
    const x = Math.round(e.x), y = Math.round(e.y), f = e.face;

    const lean = lunge ? f * 3 : 0;
    const step = melting || e.state === 'confused' || e.state === 'spawn' ? 0 : Math.floor(e.animT * 6) % 2;
    const bob = Math.floor(e.animT * 3) % 2;

    const armX = f > 0 ? x + 8 + lean : x - 8 - armLen + lean;
    const blocks = [
      [K.hippieJeans, x - 7 + step * 2, y - 14, 5, 14], [K.hippieJeans, x + 2 - step * 2, y - 14, 5, 14],  // ripped jeans
      [K.cart, x - 8 + step * 2, y - 3, 7, 3], [K.cart, x + 1 - step * 2, y - 3, 7, 3],                      // red sneakers
      [K.moon, x - 8 + lean, y - 32, 16, 18],                                                               // peace-sign shirt
      [K.hippie, x - 9 + lean, y - 32, 5, 18], [K.hippie, x + 4 + lean, y - 32, 5, 18],                      // torn purple vest
      [K.hippieSkin, armX, y - 28, armLen, 3],                                                              // claw arm
      [K.stoneLight, x - 8 + lean, y - 44, 3, 15], [K.stoneLight, x + 5 + lean, y - 44, 3, 15], [K.stoneLight, x - 7 + lean, y - 46, 14, 3], // grey dreads
      [K.hippieSkin, x - 5 + lean, y - 44, 10, 11],                                                         // olive face

    figure(ctx, blocks, flash);

    R(ctx, K.dark, x - 1 + lean, y - 29, 2, 7); R(ctx, K.dark, x - 3 + lean, y - 25, 2, 2); R(ctx, K.dark, x + 1 + lean, y - 25, 2, 2); // peace sign
    R(ctx, detail(K.moon), x + f * 2 - 1 + lean, y - 41, 2, 2);                                              // glowing pale eye
    R(ctx, detail(K.hippieGoo), x + f * 3 + lean, y - 35, 2, 3 + bob);                                        // slime from the mouth
    if (lunge) { R(ctx, K.white, f > 0 ? armX + armLen - 1 : armX, y - 29, 1, 1); R(ctx, K.white, f > 0 ? armX + armLen - 1 : armX, y - 26, 1, 1); } // claws

  }

  // ---------- sweater: gold zigzag knit, purple and teal, 52 px; never flinches, flops over ----------
  function drawSweater(ctx, e) {
    const flash = flashing(e), style = styleOf(e), x = Math.round(e.x), y = Math.round(e.y);
    if (defeated(e) && style === 'sliced') {
      drawSliced(ctx, e, () => { if (!sprite(ctx, 'sweater:hit', 0, e.x, e.y, e.face, false, 0)) drawSweaterPlaceholder(ctx, e, false, true); }, 48);
    } else if (!sprite(ctx, 'sweater:' + e.anim, e.animT, e.x, e.y, e.face, false, null, flash)) drawSweaterPlaceholder(ctx, e, flash);
    if (defeated(e) && style === 'flop') drawFlopBits(ctx, e); // slippers and the duck fly off, with real art or without
    if (defeated(e)) gag(ctx, e, style, y - 72);
    walkerMarks(ctx, e, x, y - 70); // he is 60 px tall with the brain: the marks sit above it
  }
  function drawSweaterPlaceholder(ctx, e, flash, standing) {
    const x = Math.round(e.x), y = Math.round(e.y), f = e.face;
    const flopping = !standing && defeated(e);
    const attack = e.state === 'attack', tell = attack && e.t < C.sweater.attackHitStart, shove = attack && !tell;
    const step = flopping || e.state === 'confused' || e.state === 'spawn' ? 0 : Math.floor(e.animT * 6) % 2;
    const blocks = [
      [K.slipper, x - 11 + step * 2, y - 5, 10, 5], [K.slipper, x + 1 - step * 2, y - 5, 10, 5],              // bunny slippers
      [K.slipperEar, f > 0 ? x - 3 + step * 2 : x - 11 + step * 2, y - 8, 2, 3], [K.slipperEar, f > 0 ? x + 9 - step * 2 : x + 1 - step * 2, y - 8, 2, 3], // ears
      [K.sweaterTealDk, x - 8 + step * 2, y - 22, 7, 17], [K.sweaterTealDk, x + 1 - step * 2, y - 22, 7, 17], // torn trousers
      [K.sweaterGold, x - 12, y - 44, 24, 23],                                                              // the knit
      [K.sweaterSkin, x - 7, y - 56, 14, 12],                                                               // head
      [K.brainPink, x - 5, y - 59, 10, 4],                                                                  // exposed brain
    ];
    if (tell) { blocks.push([K.sweaterSkin, x - 16, y - 54, 5, 14], [K.sweaterSkin, x + 11, y - 54, 5, 14]); }           // both arms up
    else if (shove) { blocks.push([K.sweaterSkin, f > 0 ? x + 12 : x - 26, y - 40, 14, 5], [K.sweaterSkin, f > 0 ? x + 12 : x - 26, y - 33, 14, 5]); } // both arms out
    else blocks.push([K.sweaterSkin, f > 0 ? x + 11 : x - 16, y - 42, 5, 14]);                                           // one arm hanging

    if (flopping) {

      const k = Math.min(1, e.t / 0.5);

      for (let i = 0; i < 6; i++) R(ctx, detail(col), x - 12 + i * 4, row + (i & 1) * 2, 4, 2);
    }

    R(ctx, detail(K.mustard), x + f * 2 - 2, y - 42, 4, 3); R(ctx, detail(K.hotdog), x + f * 4 - (f < 0 ? 1 : 0), y - 41, 1, 1); // rubber duck
    R(ctx, detail(K.slipperEar), x - 3, y - 58, 6, 1);                                                      // brain ridge
    R(ctx, detail(K.moon), x + f * 3 - 1, y - 53, 2, 2);                                                    // the eye that stayed in
    R(ctx, detail(K.slipperEar), x + f * 6, y - 51, 1, 4); R(ctx, detail(K.white), x + f * 6 - 1, y - 48, 3, 3); R(ctx, K.black, x + f * 6, y - 47, 1, 1); // the one hanging out
    R(ctx, detail(K.white), x - 3 - f, y - 46, 6, 1);                                                       // wide grin

  }
  // Flop: both slippers and the duck fly off him in arcs (from his age alone, no stored state), bouncing once on the path.
  function drawFlopBits(ctx, e) {
    const x = Math.round(e.x), y = Math.round(e.y), f = e.face, t = e.t;
    const bits = [[-f * 50, -120, 0, 'slipper'], [-f * 90, -90, 0, 'slipper'], [f * 40, -150, -40, 'duck']];

    }
  }

  // A 1 px dark outline round a list of boxes [x, y, w, h], then the boxes themselves: the coded placeholders read as one silhouette.
  function outlined(ctx, boxes) {
    for (const [x, y, w, h] of boxes) R(ctx, K.black, x - 1, y - 1, w + 2, h + 2);
    for (const [x, y, w, h, col] of boxes) R(ctx, col, x, y, w, h);
  }

  // ---------- cheerleader (maroon and cream; the leap) ----------
  // Real art: the attack strip is picked by state (1 rising, 2 falling, 3 landing); the windup shows the idle strip (she cheers).
  function drawCheerleader(ctx, e) {
    const flash = flashing(e), style = styleOf(e), x = Math.round(e.x), y = Math.round(e.y);
    if (defeated(e) && style === 'sliced') {
      drawSliced(ctx, e, () => { if (!sprite(ctx, 'cheerleader:hit', 0, e.x, e.y, e.face, false, 0)) drawCheerleaderPlaceholder(ctx, e, false, true); }, 40);
    } else {
      const frame = e.state === 'leap' ? (e.vy < 0 ? 1 : 2) : e.state === 'land' ? 3 : null;
      if (!sprite(ctx, 'cheerleader:' + e.anim, e.animT, e.x, e.y, e.face, false, frame, flash)) drawCheerleaderPlaceholder(ctx, e, flash);
    }

  }
  // Maroon skirt and pom-poms, cream top and legs, blonde hair: nothing like the jogger's green or Sammy's grey-brown.
  function drawCheerleaderPlaceholder(ctx, e, flash, standing) {
    const x = Math.round(e.x), y = Math.round(e.y), f = e.face, t = e.t;
    const body = flash ? K.white : K.cream, skirt = flash ? K.white : K.cheer;
    if (!standing && defeated(e)) {
      // Burst: she comes apart. The pom-poms and the bow fly off, the body folds into the skirt and a red splash.
      const sink = Math.min(1, t / 0.4);
      outlined(ctx, [[x - 8, y - 20 * (1 - sink) - 6, 16, 20 * (1 - sink) + 6, K.cheer], [x - 6, y - 4, 12, 4, K.cream]]);
      for (const [d, phase] of [[-1, 0], [1, 0.5]]) {
        const px = x + d * (8 + t * 60), py = y - 30 - Math.sin(Math.min(1, t + phase * 0.2) * 3) * 30 + t * t * 160;
        if (py < y - 2) { R(ctx, K.cheer, px - 3, py - 3, 6, 6); R(ctx, K.cream, px - 1, py - 1, 2, 2); } else R(ctx, K.cheer, px - 3, y - 4, 6, 3);
      }
      const bx = x - f * t * 40, by = Math.min(y - 2, y - 44 + t * t * 220);
      R(ctx, K.cheer, bx - 3, by, 6, 2); R(ctx, K.cream, bx - 1, by, 2, 2); // the hair bow

  }

  // ---------- baby (pastel pink and blue, mint skin, a pink brain; the litter) ----------

  // ---------- THE BRUTE (boss) ----------
  // Which frame of his combined strips a state shows (null = the strip's own clock: the walk loop, the death crawl).
  // swipe: 0 tell, 1 step, 2-4 hits, 5 opening | slam: 0 tell, 1 hit, 2 stuck | spin: 0 tell, 1-2 spin, 3 dizzy (also the vomit tell)
  // stagger: 0 half-health stagger, 1 enrage roar | faces: HUD portraits by state (S.bossFace).
  function bruteFrame(e) {
    const t = e.t;
    switch (e.state) {
      case 'swipe-tell': return 0; case 'swipe-step': return 1; case 'swipe-hit': return 2 + Math.min(2, Math.floor(t * 10)); case 'swipe-open': return 5;
      case 'slam-tell': return 0; case 'slam-hit': return 1; case 'slam-stuck': return 2;
      case 'spin-tell': return 0; case 'spin-hit': return 1 + Math.min(1, Math.floor(t * 10)); case 'spin-dizzy': case 'vomit-tell': return 3;
      case 'vomit-stream': case 'vomit-open': case 'confused': case 'stagger': return 0;

  // The portrait in the boss bar: which of the 17 faces, and the placeholder's mood. By health band, with a wince after a hit,
