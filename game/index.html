<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No pinch or double-tap zoom: a stray pinch mid-game would break play, and the game already scales to fill the screen. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- "Add to Home Screen" on a phone opens the game full screen, without the browser's bars. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sammy">
  <meta name="theme-color" content="#000000">
  <title>Sammy the Opossum: Zombie Hunter</title>
  <!-- Icons and the picture that shows when the link is shared (files in game/share/, copied into dist/ by the build). -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="description" content="A 16-bit action platformer. Sammy the opossum wakes up in Central Park at night, and every human is a zombie. He doesn't fuck around with zombies.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sammy the Opossum: Zombie Hunter">
  <meta property="og:description" content="A 16-bit action platformer. Tail-whip, play possum, then find the chainsaw.">
  <meta property="og:image" content="https://opossum-game-library.vercel.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sammy the Opossum: Zombie Hunter">
  <meta name="twitter:image" content="https://opossum-game-library.vercel.app/og-image.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    /* main.js sets the canvas size and position (src/layout.js does the maths) so its pixels line up with the screen's. */
    #screen { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; }
    /* On-screen touch buttons (src/touch.js places them; src/layout.js does the maths). Hidden unless on a touch screen. */
    #touch-controls { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 2; }
    #touch-controls.on { display: block; }
    .tbtn { position: absolute; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    .tbtn canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
    .tbtn.hide { display: none; }
    /* "Turn your phone sideways" message (src/phone.js), over everything while the phone is upright. */
    #sideways { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: #000; display: none; z-index: 4; touch-action: none; }
    #sideways.on { display: block; }
    #sideways canvas { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #sideways button { position: absolute; margin: 0; padding: 0; border: 0; background: transparent; color: transparent; font-size: 1px;
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #sideways button:focus-visible { outline: 2px solid #fcd824; }
    #test-result { z-index: 5; position: absolute; left: 0; top: 0; margin: 0; color: #0f0; font: 10px monospace; white-space: pre-wrap; max-width: 100%; }
  </style>
</head>
<body>
  <canvas id="screen" width="320" height="224" aria-label="Sammy game screen"></canvas>
  <pre id="test-result"></pre>
  <noscript style="color:#fff">This game needs JavaScript.</noscript>
  <!-- Plain scripts (not modules) so the game runs by double-clicking this file. Order matters. -->
  <script src="src/config.js"></script>
  <script src="src/font.js"></script>
  <script src="src/level.js"></script>
  <script src="src/assets.js"></script>
  <script src="src/asset-files.js"></script>
  <script src="src/sim.js"></script>
  <script src="src/bot.js"></script>
  <script src="src/scenery.js"></script>
  <script src="src/render.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/layout.js"></script>
  <script src="src/touch.js"></script>
  <script src="src/phone.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
