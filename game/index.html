<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sammy (placeholder prototype)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #test-result { position: absolute; left: 0; top: 0; margin: 0; color: #0f0; font: 10px monospace; white-space: pre-wrap; max-width: 100%; }
  </style>
</head>
<body>
  <canvas id="screen" width="320" height="224" aria-label="Sammy game screen"></canvas>
  <pre id="test-result"></pre>
  <noscript style="color:#fff">This game needs JavaScript.</noscript>
  <!-- Plain scripts (not modules) so the game runs by double-clicking this file. Order matters. -->
  <script src="src/config.js"></script>
  <script src="src/font.js"></script>
  <script src="src/level.js"></script>
  <script src="src/assets.js"></script>
  <script src="src/asset-files.js"></script>
  <script src="src/sim.js"></script>
  <script src="src/bot.js"></script>
  <script src="src/render.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
