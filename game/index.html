<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sammy (placeholder prototype)</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
    /* main.js sets the canvas size and position (src/layout.js does the maths) so its pixels line up with the screen's. */
    #screen { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    /* On-screen touch buttons (src/touch.js places them; src/layout.js does the maths). Hidden unless on a touch screen. */
    #touch-controls { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 2; }
    #touch-controls.on { display: block; }
    .tbtn { position: absolute; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    .tbtn canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
    .tbtn.hide { display: none; }
    #test-result { z-index: 3; position: absolute; left: 0; top: 0; margin: 0; color: #0f0; font: 10px monospace; white-space: pre-wrap; max-width: 100%; }
  </style>
</head>
<body>
  <canvas id="screen" width="320" height="224" aria-label="Sammy game screen"></canvas>
  <pre id="test-result"></pre>
  <noscript style="color:#fff">This game needs JavaScript.</noscript>
  <!-- Plain scripts (not modules) so the game runs by double-clicking this file. Order matters. -->
  <script src="src/config.js"></script>
  <script src="src/font.js"></script>
  <script src="src/level.js"></script>
  <script src="src/assets.js"></script>
  <script src="src/asset-files.js"></script>
  <script src="src/sim.js"></script>
  <script src="src/bot.js"></script>
  <script src="src/render.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/layout.js"></script>
  <script src="src/touch.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
